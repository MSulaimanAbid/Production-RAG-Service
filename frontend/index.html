<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMind — AI Document Intelligence Platform</title>
  <meta name="description" content="Production RAG Service — AI Document Intelligence Platform built with React & Tailwind." />
  <meta name="application-name" content="Production RAG Service" />
  
  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2.5'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5z'/%3E%3Cpath d='M2 17l10 5 10-5'/%3E%3Cpath d='M2 12l10 5 10-5'/%3E%3C/svg%3E" />

  <!-- Local Tailwind CSS (Instant offline loading) -->
  <script src="/static/vendor/tailwind.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          boxShadow: {
            '2xs': '0 1px 2px 0 rgba(0, 0, 0, 0.03)',
            'xs': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05)',
          }
        }
      }
    }
  </script>

  <!-- Local React 18 & ReactDOM (Instant 0-network-latency local vendor) -->
  <script src="/static/vendor/react.production.min.js"></script>
  <script src="/static/vendor/react-dom.production.min.js"></script>

  <!-- Custom Design System Stylesheet -->
  <link rel="stylesheet" href="/static/css/styles.css?v=1.0.2" />

  <!-- Non-blocking Google Fonts (Async loaded, falls back to system fonts instantly) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
</head>
<body class="bg-[#f8fafc] text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900 min-h-screen overflow-y-auto overflow-x-hidden">
  <!-- Root Container -->
  <div id="root">
    <!-- Initial Loading State -->
    <div class="flex h-screen w-screen items-center justify-center bg-[#f8fafc]">
      <div class="flex flex-col items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center shadow-sm animate-pulse">
          <svg class="w-5 h-5 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-1.5 h-1.5 rounded-full bg-blue-600 animate-bounce"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-blue-600 animate-bounce [animation-delay:-0.15s]"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-blue-600 animate-bounce [animation-delay:-0.3s]"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Application Bootstrap -->
  <script type="module">
    // Global Window Error Handler Fallback to prevent silent blank pages
    window.addEventListener('error', (e) => {
      console.error('DocuMind Uncaught Error:', e);
      const root = document.getElementById('root');
      if (root && (!root.children.length || root.innerHTML.includes('animate-pulse'))) {
        root.innerHTML = `
          <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;padding:24px;font-family:Inter,system-ui,sans-serif;">
            <div style="max-width:440px;width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);text-align:center;">
              <div style="width:48px;height:48px;background:#fef2f2;color:#ef4444;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;margin-bottom:16px;">!</div>
              <h3 style="margin:0 0 8px 0;font-size:16px;color:#0f172a;font-weight:600;">Workspace Loading Notice</h3>
              <p style="margin:0 0 20px 0;font-size:12px;color:#64748b;line-height:1.6;">A browser asset or session refresh is required to initialize the workspace interface.</p>
              <button onclick="try{localStorage.clear();}catch(e){}location.reload(true);" style="padding:10px 20px;background:#0f172a;color:#ffffff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,0.05);">
                Clear Cache & Refresh Workspace
              </button>
            </div>
          </div>
        `;
      }
    });

    import { React } from '/static/src/utils/html.js?v=1.0.8';
    import { App } from '/static/src/app.js?v=1.0.8';

    // React Error Boundary Component
    class RootErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('RootErrorBoundary caught error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return React.createElement(
            'div',
            { className: 'min-h-screen bg-[#f8fafc] flex items-center justify-center p-6' },
            React.createElement(
              'div',
              { className: 'max-w-md w-full bg-white rounded-2xl border border-slate-200/90 p-8 shadow-sm text-center space-y-4' },
              React.createElement('div', { className: 'w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center mx-auto text-xl font-bold' }, '!'),
              React.createElement('h3', { className: 'text-base font-bold text-slate-900' }, 'Session Refresh Required'),
              React.createElement('p', { className: 'text-xs text-slate-500 leading-relaxed' }, this.state.error?.message || 'An unexpected rendering issue occurred while initializing the interface.'),
              React.createElement(
                'button',
                {
                  onClick: () => {
                    try { localStorage.clear(); } catch(e) {}
                    window.location.reload(true);
                  },
                  className: 'w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold cursor-pointer shadow-sm transition-all'
                },
                'Reset Local Storage & Reload'
              )
            )
          );
        }
        return this.props.children;
      }
    }

    const rootElement = document.getElementById('root');
    const root = window.ReactDOM.createRoot(rootElement);
    root.render(React.createElement(RootErrorBoundary, null, React.createElement(App)));
  </script>
</body>
</html>
