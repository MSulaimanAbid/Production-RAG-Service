[project]
name = "production-rag-service"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Sulaiman Abid", email = "sulaimanabid29@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.3",
    "fastapi",
    "google-generativeai>=0.8",
    "httpx",
    "langchain-text-splitters>=0.3",
    "pdfplumber",
    "pydantic",
    "pydantic-settings",
    "pypdf",
    "python-docx",
    "python-dotenv",
    "python-multipart",
    "structlog",
    "tenacity",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
]


[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
